name: Manueller Demo-Agentenlauf

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Deterministischen Demo-Agenten starten
        env:
          DATA_PROVIDER: mock
          DATABASE_URL: "sqlite:///data/demo-agent.db"
        run: python -m src.agent.cli

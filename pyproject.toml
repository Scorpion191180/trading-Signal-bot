[project]
name = "trading-signal-agent"
version = "1.0.0"
description = "Kurzfristige Multi-Timeframe-Signale für D-Wave am deutschen Markt"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
